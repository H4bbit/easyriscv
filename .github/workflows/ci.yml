name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          # C23 (constexpr) needs clang >= 19; ubuntu noble ships 18.
          # Same major as local dev (21.1.8) via apt.llvm.org.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install -y -q clang-21 llvm-21-tools just libncursesw6 libncurses-dev
          echo "CC=clang-21" >> "$GITHUB_ENV"
          for t in objcopy objdump readelf; do
            b="$(command -v llvm-$t-21 || ls /usr/lib/llvm-21/bin/llvm-$t 2>/dev/null | head -1)"
            sudo update-alternatives --install /usr/bin/llvm-$t llvm-$t "$b" 100
          done
      - name: Build VM
        run: just build
      - name: Cross-check assembler (./asm vs clang, labs+solutions)
        run: just check-asm
      - name: Run all labs headless
        run: just all
  gcc-14:
    # Portability probe: vm+asm build and run under gcc-14 (noble
    # universe, C23 constexpr since gcc-13). Exercises the CC=
    # override Justfile promises. No reference toolchain here on
    # purpose: check-asm/disasm ground truth stays clang-21-only in
    # build-and-labs; this job proves gcc builds and runs the labs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-14 just libncursesw6 libncurses-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
      - name: Build VM (gcc-14)
        run: just build
      - name: Run all labs headless (gcc-14 build)
        run: just all
